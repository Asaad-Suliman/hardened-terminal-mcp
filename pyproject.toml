[project]
name = "hardened-terminal-mcp"
version = "0.1.0"
description = "A security-hardened terminal MCP server."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
hardened-terminal-mcp = "hardened_terminal_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardened_terminal_mcp"]
